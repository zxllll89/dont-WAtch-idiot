.app{display:flex;height:100vh;height:100dvh}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
/* 標題列固定在上方，內容從它底下捲過時被背景同色的半透明漸層遮住 */
h1{position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none;margin:0;padding:max(14px,env(safe-area-inset-top)) 30px 26px;display:flex;align-items:flex-end;gap:clamp(12px,1.2vw,22px);line-height:1;font-weight:500;}
h1 .ttl{display:flex;align-items:flex-end;gap:.26em;font-family:"Spongeboy","Impact","Arial Black",sans-serif;font-size:calc(var(--logo)*.86);line-height:1;letter-spacing:.03em;color:#cf2b2b;white-space:nowrap;padding-bottom:.06em}
h1 .ttl .w{display:flex}
h1 .ttl .sm{font-size:.56em;margin-bottom:.12em}
h1 .ttl i{font-style:normal;display:inline-block;text-shadow:-.045em -.045em 0 #3b0c0d,.045em -.045em 0 #3b0c0d,-.045em .045em 0 #3b0c0d,.045em .045em 0 #3b0c0d,0 .05em 0 #3b0c0d,0 -.05em 0 #3b0c0d,.05em 0 0 #3b0c0d,-.05em 0 0 #3b0c0d,.07em .11em 0 rgba(40,10,10,.5)}
h1 .logo{display:block;height:calc(var(--logo)*1.05*1.0828);width:auto;margin:calc(var(--logo)*-1.05*0.0414);max-width:none}
h1 .sub{line-height:1;padding-bottom:0;margin-bottom:calc(var(--logo)*.0305 - .12em);font-size:clamp(20px,1.8vw,34px);letter-spacing:.4em;color:var(--gold);font-weight:500;white-space:nowrap}
#scroller{-webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 8px),#000 calc(var(--hh) + 4px),#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 8px),#000 calc(var(--hh) + 4px),#000 calc(100% - 14px),transparent 100%);flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#444 transparent;padding:calc(var(--hh) + 8px) 30px calc(var(--floor) + 34px);position:relative}
#empty{text-align:center;color:#1d3f66;font-size:clamp(15px,1.3vw,20px);letter-spacing:.15em;padding:12vh 16px 0;pointer-events:none}
#wall{display:grid;grid-template-columns:repeat(auto-fill,140px);justify-content:center;column-gap:22px;row-gap:34px;grid-auto-rows:160px;max-width:1598px;margin:0 auto}

.frame{position:relative;width:140px;height:160px;cursor:pointer;filter:drop-shadow(0 9px 7px rgba(0,25,55,.35));transform-origin:50% 0;animation:hang .7s cubic-bezier(.2,.9,.3,1.2) both;transition:transform .2s}

.frame .pic{position:absolute;left:14%;top:11.5%;width:71.2%;height:76%;overflow:hidden;background:#5d8f7d;z-index:1}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .nm{position:absolute;left:23.5%;top:84.5%;width:51.6%;height:10.8%;z-index:3;display:flex;align-items:center;justify-content:center}
.frame .nm span{display:block;max-width:100%;padding:0 1px;text-align:center;font-size:12px;font-weight:700;letter-spacing:0;color:#fff3df;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px rgba(0,0,0,.6)}
@keyframes hang{0%{opacity:0;transform:translateY(-40px) rotate(-6deg)}60%{opacity:1;transform:rotate(2deg)}100%{transform:none}}

/* 長按拖曳排序 */
.frame{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.frame img{-webkit-user-drag:none;pointer-events:none}
#wall.dragging{-webkit-user-select:none;user-select:none}
.dragging .frame:hover{transform:none}
.frame.ph{opacity:.3}
.frame.ghost{position:fixed;z-index:60;margin:0;pointer-events:none;animation:none !important;transition:none;transform:scale(1.12);opacity:.97;will-change:transform,left,top;filter:drop-shadow(0 24px 14px rgba(0,25,55,.45))}

/* 右側輸入面板 */
#panel{flex:none;position:relative;width:clamp(316px,20vw,380px);margin:20px 20px 20px 0;padding:14px 14px 20px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#444 transparent;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:center;justify-content:space-between}
#panel h2{margin:0;font-size:22px;color:var(--gold);font-weight:500;letter-spacing:.2em}
.x{display:none;position:absolute;top:8px;right:12px;z-index:3;background:none;border:0;color:var(--gold);font-size:34px;line-height:1;cursor:pointer;padding:0 6px}
#panel small{color:#8d9488}
label{font-size:14px;color:#b9bfb0;display:block;margin-bottom:6px}
label em{font-style:normal;color:#7b8277;font-size:12px}
input[type=text],input[type=password],textarea{width:100%;background:rgba(0,0,0,.45);border:1px solid #3b423a;border-radius:4px;color:var(--ink);padding:10px 12px;font:inherit;font-size:16px;outline:none}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:none;height:170px;line-height:1.6}
.row{display:flex;gap:14px;align-items:center}
#prev{width:105px;height:120px;flex:none;border:1px dashed #5a6256;border-radius:3px;background:rgba(0,0,0,.4) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#6f776a;font-size:12px;text-align:center;cursor:pointer}
.btn{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:8px 14px;border-radius:4px;cursor:pointer;font:inherit;font-size:14px}
.btn:hover{background:rgba(255,210,63,.18)}
#submit{margin-top:auto;background:var(--gold);color:#1a1608;border:0;font-weight:700;font-size:17px;letter-spacing:.3em;padding:13px;border-radius:4px;cursor:pointer}
#submit:hover{filter:brightness(1.1)}
h1 #cnt{flex:0 1 auto;min-width:0;font-size:clamp(13px,1.15vw,19px);line-height:1.3;letter-spacing:.08em;font-weight:700;color:#f4ecd8;margin-bottom:calc(var(--logo)*.04);filter:url(#cntO)}
#fab{display:none}

/* 登入入口：圖片（hover 微放大）→ 密碼 → 登錄區塊 */
.sp{font-family:"Spongeboy","Impact","Arial Black",sans-serif}
#lg{display:block;width:100%;flex:none;margin-top:calc(31vh - 34px);cursor:pointer;outline:none;transition:transform .2s,margin-top .35s ease,width .35s ease;filter:drop-shadow(0 9px 7px rgba(0,25,55,.35));-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#lg img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
#lg:hover,#lg:focus-visible{transform:scale(1.05)}
#panel.in #lg{cursor:default;margin-top:clamp(0px,2vh,20px);width:72%;align-self:center}
#panel.in #lg:hover,#panel.in #lg:focus-visible{transform:none}
#lgtxt{text-align:center;font-size:clamp(44px,3.3vw,58px);line-height:1;letter-spacing:.04em;color:#c0120a;white-space:nowrap;text-shadow:0.055em 0.000em 0 #4c0200,0.051em 0.021em 0 #4c0200,0.040em 0.038em 0 #4c0200,0.022em 0.050em 0 #4c0200,0.002em 0.055em 0 #4c0200,-0.019em 0.052em 0 #4c0200,-0.037em 0.041em 0 #4c0200,-0.049em 0.024em 0 #4c0200,-0.055em 0.004em 0 #4c0200,-0.052em -0.017em 0 #4c0200,-0.042em -0.035em 0 #4c0200,-0.026em -0.049em 0 #4c0200,-0.006em -0.055em 0 #4c0200,0.015em -0.053em 0 #4c0200,0.034em -0.043em 0 #4c0200,0.048em -0.028em 0 #4c0200,0.054em -0.008em 0 #4c0200}
.card{background:var(--panel);border:3px solid #24150a;border-radius:6px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px;animation:pop .28s ease both}
#pw{flex-direction:row;gap:10px;align-items:stretch}
#pwi{flex:1;min-width:0;font-family:"Spongeboy","Impact","Arial Black",sans-serif;font-size:20px;letter-spacing:.12em;padding:8px 12px}
#pwi::placeholder{color:#8d9488}
#pw .btn{flex:none;padding:8px 14px}
#pw.bad{animation:shake .32s}
#pw[hidden],#reg[hidden],#lgtxt[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

#toast{position:fixed;left:50%;top:max(20px,env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:50;max-width:90vw;background:#10140f;border:1px solid var(--gold);color:var(--gold);padding:12px 26px;border-radius:6px;font-size:18px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 點開相框的說明框 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
#modal.on{display:flex}
#card{width:min(760px,100%);max-height:100%;overflow-y:auto;display:flex;gap:30px;padding:34px;background:#3a2414;border:3px solid #1f1208;box-shadow:inset 0 0 0 1px rgba(255,225,170,.25);border-radius:6px}
#card .big{width:230px;height:264px;flex:none;border:7px solid #2b2f2b;background:#c9773c}
#card .big img{width:100%;height:100%;object-fit:cover;display:block}
#card .info{flex:1;min-width:0}
#card h3{margin:0 0 14px;font-size:clamp(28px,3vw,38px);color:var(--gold);font-weight:500;word-break:break-word}
#card p{margin:0 0 22px;line-height:1.8;font-size:clamp(17px,1.6vw,22px);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
#card .btn{font-size:18px;padding:10px 20px}
#card .acts{display:flex;flex-wrap:wrap;gap:10px}
#cm{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,191,31,.3)}
#cm h4{margin:0 0 10px;font-size:16px;color:var(--gold);font-weight:500;letter-spacing:.1em}
#clist{max-height:190px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:#444 transparent}
.cmt{background:rgba(255,255,255,.06);border-radius:4px;padding:8px 10px}
.cmt .h{font-size:13px;color:#8d9488;display:flex;justify-content:space-between;gap:8px;align-items:center}
.cmt .h b{color:var(--gold);font-weight:500;font-size:14px}
.cmt .t{margin-top:4px;font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cmt .d{background:none;border:0;color:#8d9488;cursor:pointer;font:inherit;font-size:13px;padding:0 2px;flex:none}
.cmt .d:hover{color:#ddd}
.cmt .d.sure{color:#ff6b5a}
.cnone{color:#6f776a;font-size:14px}
.cform{display:flex;flex-direction:column;gap:8px}
#cname{font-size:15px;padding:8px 10px}
#ctext{height:64px;font-size:16px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px}
#mnote{margin-top:14px;color:#8d9488;font-size:14px}
#mnote:not([hidden]){display:block}
#card #ename{font-size:24px;margin-bottom:12px}
#card #edeeds{font-size:18px;height:190px;margin-bottom:16px}

/* 平板／手機：單欄，輸入面板改成底部彈出 */
@media (max-width:900px){
 /* 手機也用「固定視窗＋內部捲動」，內容就不會跑到網址列／工具列後面 */
 h1{right:0;padding-left:16px;padding-right:16px}
 #scroller{padding:calc(var(--hh) + 6px) 16px calc(var(--floor) + 112px + env(safe-area-inset-bottom));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
 #panel{position:fixed;left:0;right:0;bottom:0;width:auto;margin:0;max-height:90vh;max-height:90dvh;border-radius:16px 16px 0 0;border-bottom:0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));z-index:30;transform:translateY(110%);visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s;background:rgba(52,33,18,.98)}
 #panel.open{transform:none;visibility:visible;transition-delay:0s}
 .x{display:block}
 #fab{display:block;position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:20;width:min(48vw,200px);padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;filter:url(#fabO) drop-shadow(0 6px 8px rgba(0,25,55,.45));transition:transform .18s}
 #fab img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
 #fab:hover,#fab:focus-visible{transform:scale(1.05)}
 textarea{height:130px}
 #panel{border:3px solid #24150a;border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.5);gap:12px}
 #lg{width:min(100%,260px);align-self:center;margin-top:0}
 #lgtxt{font-size:46px}
 .card{background:none;border:0;box-shadow:none;padding:0}
 h1 #cnt{position:absolute;left:16px;right:16px;top:calc(var(--hh) - 17px);margin:0;font-size:12px;filter:url(#cntOm);line-height:1.2}
 /* 登入後：章魚哥縮小靠右，和「標題＋上傳照片」同一橫排、等高 */
 #panel{--ph:clamp(56px,calc((100vw - 220px)/2.4),96px);--H:calc(40px + var(--ph));--iw:calc(var(--H)*1.3585)}
 #panel.in{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;row-gap:12px;align-content:start;padding-top:46px}
 #panel.in #reg{display:contents}
 #panel.in #lg{grid-column:2;grid-row:1 / span 2;width:var(--iw);height:var(--H);margin:0;align-self:start;justify-self:end}
 #panel.in #lg img{width:100%;height:100%;object-fit:contain}
 #panel.in #reg>h2{grid-column:1;grid-row:1;height:28px;margin:0;line-height:28px;font-size:clamp(17px,5vw,22px);letter-spacing:.1em;white-space:nowrap}
 #panel.in #reg>.row{grid-column:1;grid-row:2;gap:12px;height:var(--ph);min-width:0}
 #panel.in .row>div:not(#prev){min-width:0}
 #panel.in #prev{width:calc(var(--ph)*.875);height:var(--ph);font-size:11px}
 #panel.in #fname{white-space:nowrap!important;overflow:hidden;text-overflow:ellipsis}
 #panel.in #reg>:not(h2):not(.row){grid-column:1 / -1}
}
@media (max-width:640px){
 h1 .ttl{font-size:calc(var(--logo)*.7)}
 #card{flex-direction:column;align-items:center;padding:20px;gap:16px}
 #card .big{width:min(46vw,190px);height:auto;aspect-ratio:140/160}
 #card .info{width:100%;flex:none}
 #card .btn{font-size:16px;padding:10px 16px}
}
</style>

function render(){
 if(drag){pendingRender=true;return}
 const ids=members.map(m=>m.id);
 const fresh=known===null?new Set():new Set(ids.filter(id=>!known.has(id)));
 known=new Set(ids);
 wall.innerHTML='';let target=null;
 members.forEach(m=>{
  const f=document.createElement('div');f.className='frame';f.dataset.id=m.id;
  if(!fresh.has(m.id))f.style.animation='none';
  const p=document.createElement('div');p.className='pic';
  const i=document.createElement('img');i.src=m.img||DEF;i.alt='';i.draggable=false;
  const n=document.createElement('div');n.className='nm';const ns=document.createElement('span');ns.textContent=m.name;n.append(ns);
  p.append(i);f.append(p,n);f.onclick=()=>{if(suppressClick)return;openCard(m)};wall.append(f);
  if(m.id===lastMine)target=f});
 empty.style.display=members.length?'none':'block';
 status();
 if(target){lastMine=null;target.scrollIntoView({block:'center',behavior:'smooth'})}
}

/* ---------- 資料存取（Firebase / 本機兩種模式共用） ---------- */
function addMember(name,deeds,img){
 const ts=Date.now();
 if(FB_ON){
  if(!membersRef){toast('尚未連線，請稍後再試');return false}
  const id=membersRef.push().key;lastMine=id;
  const rec={name,deeds,owner:uid,ts};if(img)rec.img=img;
  membersRef.child(id).set(rec).catch(e=>toast('送出失敗：'+(e.code||e.message)));
 }else{
  const id=ts+''+Math.floor(Math.random()*1000);lastMine=id;
  members.push({id,name,deeds,img,ts});saveLocal();render();
 }
 return true}
function updateMember(m,fields){
 Object.assign(m,fields);
 if(FB_ON){
  const f={name:fields.name,deeds:fields.deeds};if('img' in fields)f.img=fields.img;
  membersRef.child(m.id).update(f).catch(e=>toast('儲存失敗：'+(e.code||e.message)));
 }else{saveLocal();render()}}
function removeMember(m){
 if(FB_ON){firebase.database().ref().update({['members/'+m.id]:null,['comments/'+m.id]:null}).catch(e=>toast('刪除失敗：'+(e.code||e.message)))}
 else{members=members.filter(x=>x.id!==m.id);saveLocal();const c=loadCmts();delete c[m.id];saveCmts(c);render()}}

async function init(){
 if(!FB_ON){
  try{members=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){members=[]}
  sortMembers();render();return}
 status();
 try{
  await loadScript(SDK+'firebase-app-compat.js');
  await loadScript(SDK+'firebase-auth-compat.js');
  await loadScript(SDK+'firebase-database-compat.js');
  firebase.initializeApp(firebaseConfig);
  uid=(await firebase.auth().signInAnonymously()).user.uid;
  const db=firebase.database();
  db.ref('.info/connected').on('value',s=>{online=!!s.val();status()});
  membersRef=db.ref('members');
  membersRef.orderByChild('ts').on('value',snap=>{
   const arr=[];snap.forEach(ch=>{arr.push(Object.assign({id:ch.key},ch.val()))});
   members=arr;sortMembers();render()},
   err=>toast('讀取失敗：'+(err.code||err.message)));
 }catch(e){
  console.error(e);
  empty.style.display='block';
  empty.textContent='連線 Firebase 失敗（'+(e.code||e.message)+'），請檢查設定與 README 教學';
  toast('Firebase 連線失敗');
 }
}

/* ---------- 輸入面板 ---------- */
$('fab').onclick=()=>panel.classList.add('open');
$('pclose').onclick=()=>panel.classList.remove('open');

/* ---------- 登入入口：點圖 → 輸入密碼 → 登錄區塊 ---------- */
const PASS='wacow',lg=$('lg'),pw=$('pw'),pwi=$('pwi'),reg=$('reg');
function openPw(){if(!pw.hidden||!reg.hidden)return;pw.hidden=false;pwi.focus()}
lg.onclick=openPw;
lg.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPw()}};
function tryPw(){
 if(pwi.value.trim()===PASS){
  pwi.value='';pw.hidden=true;$('lgtxt').hidden=true;reg.hidden=false;panel.classList.add('in');
  setTimeout(()=>$('name').focus(),50);return}
 toast('密碼錯誤');pwi.value='';
 pw.classList.remove('bad');void pw.offsetWidth;pw.classList.add('bad');pwi.focus()}
$('pwok').onclick=tryPw;
pwi.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tryPw()}};

// 圖片處理：裁成 140x160 比例並縮小（縮小才不會耗太多免費流量）
let avatar='';
const file=$('file'),prev=$('prev');
$('pick').onclick=prev.onclick=()=>file.click();
function toAvatar(f,cb){
 const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const W=280,H=320,c=document.createElement('canvas');c.width=W;c.height=H;
  const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;
  c.getContext('2d').drawImage(im,(W-w)/2,(H-h)/2,w,h);
  cb(c.toDataURL('image/jpeg',.72))};
  im.src=r.result};
 r.readAsDataURL(f)}
file.onchange=()=>{
 const f=file.files[0];if(!f)return;
 toAvatar(f,u=>{avatar=u;prev.style.backgroundImage='url('+u+')';prev.textContent='';$('fname').textContent=f.name})};

const deeds=$('deeds');
deeds.oninput=()=>$('cc').textContent=deeds.value.length+' / 200';

$('submit').onclick=()=>{
 const name=$('name').value.trim(),d=deeds.value.trim();
 if(!name){toast('請輸入名字');return}
 if(!d){toast('請輸入事蹟');return}
 if(!addMember(name,d,avatar))return;
 $('name').value='';deeds.value='';deeds.oninput();
 avatar='';file.value='';prev.style.backgroundImage='';prev.innerHTML='點擊上傳照片<br>（選填）';
 $('fname').textContent='';
 panel.classList.remove('open');
};

/* ---------- 說明框：檢視／編輯／刪除 ---------- */
const modal=$('modal');let cur=null;
function openCard(m){cur=m;resetDel();setEdit(false);$('mimg').src=m.img||DEF;
 $('mname').textContent=m.name;$('mdeeds').textContent=m.deeds;modal.classList.add('on');watchComments(m)}
function closeCard(){modal.classList.remove('on');unwatchComments()}
$('mclose').onclick=closeCard;
modal.onclick=e=>{if(e.target===modal)closeCard()};
let delT=null;const mdel=$('mdel');
function resetDel(){clearTimeout(delT);mdel.textContent='刪除';mdel.style.cssText=''}
mdel.onclick=()=>{
 if(!cur||!canEdit(cur))return;
 if(mdel.textContent==='刪除'){mdel.textContent='再按一次確認刪除';mdel.style.cssText='background:#c0392b;border-color:#c0392b;color:#fff';delT=setTimeout(resetDel,3500);return}
 resetDel();removeMember(cur);closeCard()};

let newImg=null,removeImg=false,editing=false;
function refreshPicBtn(){$('mpicdel').hidden=!(editing&&(newImg||(cur&&cur.img&&!removeImg)))}
function setEdit(on){
 editing=on;$('cm').hidden=on;
 const ce=cur?canEdit(cur):true;
 $('mname').hidden=$('mdeeds').hidden=on;
 $('mclose').hidden=on;
 $('medit').hidden=on||!ce;$('mdel').hidden=on||!ce;
 ['ename','edeeds','msave','mcancel','mpic'].forEach(i=>$(i).hidden=!on);
 if(on&&cur){$('ename').value=cur.name;$('edeeds').value=cur.deeds}
 newImg=null;removeImg=false;refreshPicBtn()}
$('medit').onclick=()=>setEdit(true);
$('mpic').onclick=()=>$('efile').click();
$('efile').onchange=()=>{
 const f=$('efile').files[0];if(!f)return;
 toAvatar(f,u=>{newImg=u;removeImg=false;$('mimg').src=u;refreshPicBtn()});$('efile').value=''};
$('mpicdel').onclick=()=>{removeImg=true;newImg=null;$('mimg').src=DEF;refreshPicBtn()};
$('mcancel').onclick=()=>{$('mimg').src=cur.img||DEF;setEdit(false)};
$('msave').onclick=()=>{
 const nm=$('ename').value.trim(),d=$('edeeds').value.trim();
 if(!nm){toast('請輸入名字');return}
 if(!d){toast('請輸入事蹟');return}
 const fields={name:nm,deeds:d};if(newImg)fields.img=newImg;else if(removeImg)fields.img=null;
 updateMember(cur,fields);openCard(cur)};

/* ---------- 長按相框拖曳換位置（像手機桌面） ---------- */
let press=null,drag=null,suppressClick=false,pendingRender=false;
const posKey=m=>m.pos!=null?m.pos:m.ts;
function sortMembers(){members.sort((a,b)=>posKey(a)-posKey(b))}
function flip(mutate){
 const els=[...wall.children],first=new Map(els.map(e=>[e,e.getBoundingClientRect()]));
 mutate();
 els.forEach(e=>{
  const l=e.getBoundingClientRect(),f=first.get(e),dx=f.left-l.left,dy=f.top-l.top;
  if(!dx&&!dy)return;
  e._busy=true;e.style.transition='none';e.style.transform='translate('+dx+'px,'+dy+'px)';
  e.getBoundingClientRect();e.style.transition='transform .22s';e.style.transform='';
  setTimeout(()=>{e._busy=false;e.style.transition=''},260)});
}
function cancelPress(){if(press){clearTimeout(press.t);press=null}}
wall.addEventListener('pointerdown',e=>{
 if(drag||(e.pointerType==='mouse'&&e.button!==0))return;
 const f=e.target.closest('.frame');if(!f)return;
 cancelPress();
 const p={f,id:e.pointerId,x:e.clientX,y:e.clientY};
 p.t=setTimeout(()=>{if(press===p){press=null;startDrag(p)}},450);
 press=p});
wall.addEventListener('contextmenu',e=>{if(e.target.closest('.frame'))e.preventDefault()});
function startDrag(p){
 const el=p.f,r=el.getBoundingClientRect();
 const ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.removeAttribute('data-id');
 ghost.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';
 document.body.appendChild(ghost);
 drag={el,ghost,id:p.id,dx:p.x-r.left,dy:p.y-r.top,x:p.x,y:p.y};
 el.classList.add('ph');wall.classList.add('dragging');
 suppressClick=true;
 if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){}
 drag.amp=0;drag.ph=0;drag.sv=0;drag.lx=p.x;drag.ly=p.y;
 requestAnimationFrame(autoScroll);requestAnimationFrame(swing)}
/* 被拖曳的相框：移動時左右來回輕晃，停住後幅度慢慢縮小到靜止 */
function swing(){
 if(!drag)return;
 const d=drag,sp=Math.hypot(d.x-d.lx,d.y-d.ly);d.lx=d.x;d.ly=d.y;
 d.sv+=(sp-d.sv)*.2;
 const target=Math.min(5,d.sv*.35);
 d.amp+=(target-d.amp)*.1;
 d.ph+=.2;
 if(d.amp<.03)d.amp=0;
 d.ghost.style.transform='scale(1.12) rotate('+(d.amp*Math.sin(d.ph)).toFixed(2)+'deg)';
 requestAnimationFrame(swing)}
function hitTest(x,y){
 const el=drag.el,kids=[...wall.children];
 const t=kids.find(k=>{if(k===el||k._busy)return false;const r=k.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom});
 if(t){const i=kids.indexOf(el),j=kids.indexOf(t);flip(()=>wall.insertBefore(el,i<j?t.nextSibling:t));return}
 const last=kids[kids.length-1];
 if(last&&last!==el&&!last._busy){const r=last.getBoundingClientRect();
  if(y>r.bottom+10||(y>=r.top&&x>r.right+10))flip(()=>wall.appendChild(el))}}
function autoScroll(){
 if(!drag)return;
 const sc=$('scroller'),win=getComputedStyle(sc).overflowY==='visible',hh=document.querySelector('h1').offsetHeight;
 let top,bot;
 if(win){top=hh;bot=innerHeight}else{const r=sc.getBoundingClientRect();top=r.top+hh;bot=r.bottom}
 const edge=70;let v=0;
 if(drag.y<top+edge)v=-Math.min(18,Math.ceil((top+edge-drag.y)/5));
 else if(drag.y>bot-edge)v=Math.min(18,Math.ceil((drag.y-(bot-edge))/5));
 if(v){(win?window:sc).scrollBy(0,v);hitTest(drag.x,drag.y)}
 requestAnimationFrame(autoScroll)}
window.addEventListener('pointermove',e=>{
 if(press&&e.pointerId===press.id&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10)cancelPress();
 if(!drag||e.pointerId!==drag.id)return;
 drag.x=e.clientX;drag.y=e.clientY;
 drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
 hitTest(e.clientX,e.clientY)});
function endPointer(e){
 if(press&&e.pointerId===press.id)cancelPress();
 if(!drag||e.pointerId!==drag.id)return;
 const {el,ghost}=drag;drag=null;
 wall.classList.remove('dragging');
 const r=el.getBoundingClientRect();
 ghost.style.transition='left .18s,top .18s,transform .18s';
 ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';ghost.style.transform='none';
 setTimeout(()=>{ghost.remove();el.classList.remove('ph')},200);
 saveOrder();
 if(pendingRender){pendingRender=false;render()}
 setTimeout(()=>{suppressClick=false},80)}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);
document.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});
function saveOrder(){
 const ids=[...wall.children].map(c=>c.dataset.id).filter(Boolean);
 if(ids.length===members.length&&ids.every((id,i)=>id===members[i].id))return;
 const by=new Map(members.map(m=>[m.id,m]));
 const next=ids.map(id=>by.get(id)).filter(Boolean);
 members.forEach(m=>{if(!ids.includes(m.id))next.push(m)});
 const upd={};
 next.forEach((m,i)=>{if(m.pos!==i+1){m.pos=i+1;upd['members/'+m.id+'/pos']=i+1}});
 members=next;
 if(FB_ON){
  if(membersRef&&Object.keys(upd).length)firebase.database().ref().update(upd).catch(e=>{toast('排序儲存失敗：'+(e.code||e.message))});
 }else{saveLocal();render()}}

/* ---------- 留言：任何人可新增與刪除，不能修改 ---------- */
const CKEY='hof-comments-v1',NKEY='hof-nick';
function loadCmts(){try{return JSON.parse(localStorage.getItem(CKEY)||'{}')}catch(e){return {}}}
function saveCmts(c){try{localStorage.setItem(CKEY,JSON.stringify(c))}catch(e){toast('瀏覽器儲存空間不足')}}
let cQuery=null,cCb=null,cMid=null,cList=[];
function unwatchComments(){if(cQuery&&cCb)cQuery.off('value',cCb);cQuery=cCb=null;cMid=null}
function watchComments(m){
 unwatchComments();cMid=m.id;
 try{$('cname').value=localStorage.getItem(NKEY)||''}catch(e){}
 $('ctext').value='';
 if(FB_ON&&membersRef){
  cQuery=firebase.database().ref('comments/'+m.id).orderByChild('ts');
  cCb=cQuery.on('value',snap=>{const a=[];snap.forEach(ch=>{a.push(Object.assign({id:ch.key},ch.val()))});drawComments(a)},
   err=>toast('留言讀取失敗：'+(err.code||err.message)));
 }else{
  drawComments(loadCmts()[m.id]||[]);
 }
}
function fmtTime(ts){try{return new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){return ''}}
function drawComments(list){
 cList=list;
 const box=$('clist');box.innerHTML='';
 $('chead').textContent='留言（'+list.length+'）';
 if(!list.length){const d=document.createElement('div');d.className='cnone';d.textContent='還沒有留言，來當第一個吧。';box.append(d);return}
 list.forEach(c=>{
  const w=document.createElement('div');w.className='cmt';
  const h=document.createElement('div');h.className='h';
  const l=document.createElement('span');const b=document.createElement('b');b.textContent=c.name||'訪客';
  l.append(b,' ・ '+fmtTime(c.ts));
  const del=document.createElement('button');del.type='button';del.className='d';del.textContent='刪除';
  let t=null;
  del.onclick=()=>{
   if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='確定刪除？';t=setTimeout(()=>{del.classList.remove('sure');del.textContent='刪除'},3000);return}
   clearTimeout(t);removeComment(c)};
  h.append(l,del);
  const tx=document.createElement('div');tx.className='t';tx.textContent=c.text;
  w.append(h,tx);box.append(w)});
 box.scrollTop=box.scrollHeight;
}
function removeComment(c){
 if(!cMid)return;
 if(FB_ON){firebase.database().ref('comments/'+cMid+'/'+c.id).remove().catch(e=>toast('刪除留言失敗：'+(e.code||e.message)))}
 else{const all=loadCmts();all[cMid]=(all[cMid]||[]).filter(x=>x.id!==c.id);saveCmts(all);drawComments(all[cMid])}
}
$('csend').onclick=()=>{
 if(!cMid)return;
 const text=$('ctext').value.trim(),name=$('cname').value.trim();
 if(!text){toast('請輸入留言內容');return}
 try{localStorage.setItem(NKEY,name)}catch(e){}
 const rec={text,ts:Date.now()};if(name)rec.name=name;
 if(FB_ON){
  if(!membersRef){toast('尚未連線，請稍後再試');return}
  firebase.database().ref('comments/'+cMid).push(rec).catch(e=>toast('留言失敗：'+(e.code||e.message)));
 }else{
  const all=loadCmts();rec.id=rec.ts+''+Math.floor(Math.random()*1000);
  (all[cMid]=all[cMid]||[]).push(rec);saveCmts(all);drawComments(all[cMid]);
 }
 $('ctext').value='';
};

init();
</script>
